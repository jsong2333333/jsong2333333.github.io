    Projects:
      - name: "MultiBreak: A Scalable and Diverse Multi-turn Jailbreak Benchmark for Stress-testing LLM Safety"
        summary: "May 2025 – Present"
        highlights:
          - Building a scalable multi-turn jailbreak benchmark with active-learning–based data expansion on diverse harm categories.
          - Stress-testing LLMs' safety performance, revealing persistent vulnerabilities to conversational attacks.

      - name: "FluidGaussian: Propagating Simulation-Based Uncertainty Toward Functionally-Intelligent 3D Reconstruction"
        url: https://arxiv.org/abs/2603.21356
        summary: "Aug 2024 – Present"
        highlights:
          - Building a physics-informed metric to evaluate next-best-view (NBV) methods for 3D reconstruction.
          - Integrating geometric uncertainty through differentiable grid-based methods.

      - name: "PDE-Controller: LLMs for Autoformalization and Reasoning of PDEs"
        url: https://arxiv.org/abs/2502.00963
        summary: "Oct 2024 – Jan 2025"
        highlights:
          - LLM for conversion between PDE-related natural language to formal temporal logic and executable programming code.
          - Incorporated and designed back-translation and auto-verification pipeline for data generation.

      - name: "HPC-Driven Modeling with ML-Based Surrogates for Magnon-Photon Dynamics in Hybrid Quantum Systems"
        url: https://arxiv.org/abs/2510.22221
        summary: "Oct 2023 – May 2024"
        highlights:
          - Developed a physics-informed deep learning framework for dynamics forecasting of electric fields.
          - Established a curriculum learning method for long-horizon prediction and improving generalization performance.

      - name: "Data-Efficient Operator Learning via Unsupervised Pretraining and In-Context Learning"
        url: https://arxiv.org/abs/2402.15734
        summary: "Nov 2023 – Jan 2024"
        highlights:
          - Proposed a data-efficient training pipeline for optimizing efficiency and accuracy.
          - Studied the limitations on data (masking, subsample ratio, etc.) for downstream tasks on different PDE systems.

      - name: "Learning Spatiotemporal Dynamics From Sparse Measurements"
        summary: "Mar 2023 – Dec 2023"
        highlights:
          - Designed a NeuralODE model for predicting temporal dynamics using sparse measurements, with a Swin Transformer-based decoder for reconstructing spatiotemporal dynamics.
          - Ran experiments on various datasets (e.g., turbulence and climate data ERA5) and contributed to a paper.

      - name: "IARPA TrojAI for Model Robustness against Backdoor Attack"
        summary: "Oct 2021 – Aug 2024"
        highlights:
          - Evaluated model robustness against backdoor attacks using weight-based analysis, trigger inversion, or input perturbation.
          - Developed detection and mitigation pipelines for backdoor attacks across domains (CV, LLM, cyber security).
          - Secured top 2 place for the majority of TrojAI rounds and ranked in the top 5 for NeurIPS TDC 2022 (detection track).

