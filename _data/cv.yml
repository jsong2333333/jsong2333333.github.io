    Research Projects:
      - name: "Coarse-to-fine Diversity Reward for Multi-turn Jailbreak Attacks"
        summary: "Feb 2026 - Present"
        highlights:
          - Injecting strategic and content diversity into attacker training with GRPO.
          - Showing that higher diversity improves pass@k and weak-to-strong transferability of attacks.

      - name: "An Automated Generation Framework for Task-Specific Agentic Safety"
        summary: "May 2026 - Present"
        highlights:
          - Proposing an automatic generation pipeline that builds task-dependent attacks from policy-grounded risk specifications, with fine-grained prompt-injection locations and templates.

      - name: "Multi-turn Jailbreak Benchmark for Stress-testing LLM Safety"
        url: https://arxiv.org/abs/2605.01687
        summary: "May 2025 - Jan 2026"
        highlights:
          - Built a scalable multi-turn jailbreak benchmark with active-learning-based data expansion across diverse harm categories.
          - Stress-tested LLMs' safety performance, revealing persistent vulnerabilities to conversational attacks.

      - name: "PDE Control Using Formal Languages and Large Language Models"
        url: https://arxiv.org/abs/2502.00963
        summary: "Oct 2024 - Jan 2025"
        highlights:
          - Used LLMs to convert PDE-related natural language into formal temporal logic and executable control code.
          - Designed a back-translation and auto-verification pipeline for data generation.

      - name: "Operator Learning via Unsupervised Pretraining and Scalable In-Context Learning"
        url: https://arxiv.org/abs/2402.15734
        summary: "Nov 2023 - Jan 2024"
        highlights:
          - Proposed a data-efficient training pipeline for optimizing efficiency and accuracy.
          - Studied the limitations on data (masking, subsample ratio, etc.) for downstream tasks on different PDE systems.

      - name: "Propagating Geometric Uncertainty through Numerical PDE Solutions"
        url: https://arxiv.org/abs/2603.21356
        summary: "Aug 2024 - Apr 2026"
        highlights:
          - Built a physics-informed metric to evaluate next-best-view (NBV) methods for 3D reconstruction.
          - Propagated geometric uncertainty through differentiable grid-based methods.

      - name: "IARPA TrojAI for Model Robustness against Backdoor Attack"
        summary: "Oct 2021 - Aug 2024"
        highlights:
          - Evaluated model robustness on backdoor attacks using weight-based analysis, trigger inversion, and input perturbation.
          - Developed detection and mitigation pipelines for backdoor attacks across domains (CV, LLM, cyber security).
          - Placed top 2 in the majority of TrojAI rounds and top 5 in NeurIPS TDC 2022 (detection track).

